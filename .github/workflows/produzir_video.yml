name: Produtor de Vídeos - Teste

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          echo "================================"
          echo "PRODUTOR AUTOMÁTICO DE VÍDEOS"
          echo "================================"
          echo "Branch: $GITHUB_REF"
          echo ""
          echo "Python:"
          python --version
          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1
          echo ""
          echo "Estrutura do produtor:"
          ls -la scripts/produtor
          echo ""
          echo "Ambiente configurado com sucesso!"